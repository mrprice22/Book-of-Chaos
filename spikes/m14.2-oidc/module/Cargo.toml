[package]
name = "m14_2_oidc_spike"
version = "0.0.0"
edition = "2024"
publish = false

# A throwaway module for the M14.2 spike. Not part of the product, not in the gate:
# docs/decisions/0002-durable-sign-in.md is the deliverable, and spikes/m14.2-oidc/run.sh
# is how to reproduce it.

[lib]
crate-type = ["cdylib"]

[features]
# The negative control: treat any caller with a JWT as signed in, skipping the
# module's own iss/aud check. run.sh's untrusted-issuer probes must go red under it.
trust_any = []

[dependencies]
# Pinned to the version server/Cargo.lock resolves, as in the M14.1 spike.
spacetimedb = "=2.8.0"
