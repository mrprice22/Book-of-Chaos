name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"

    # A cache is correct only if the result is identical with and without it. Until
    # this matrix existed that property was assumed, and assuming it went wrong three
    # times — most recently when run #10 went red on a docs-only commit because it was
    # the first run in a while to actually *hit* the cache.
    #
    # The reason it hid for so long is that every interesting run misses: the key
    # includes ci.yml, so any change to CI itself busts it. The restore path was
    # therefore exercised only on the runs nobody was looking at. Run #11's green,
    # which was reported as confirmation of a fix, was a cache miss and proved nothing
    # about the restore path.
    #
    # `cold` skips the caches entirely and installs from scratch; `warm` restores, and
    # seeds the cache itself on first run. Both must be green. They run in parallel, so
    # wall-clock is unchanged and only billed minutes double — free on a public repo.
    strategy:
      # Without this, one leg failing cancels the other — and the *difference* between
      # the two legs is the entire diagnostic value of running both.
      fail-fast: false
      matrix:
        cache: [cold, warm]

    steps:
      - uses: actions/checkout@v7

      # CI installs the toolchain with the same script the dev container uses, so a
      # green CI run and a green local run mean the same thing. Divergence between
      # the two is the classic way a verify gate stops being trustworthy.
      - name: Cache toolchain
        if: matrix.cache == 'warm'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/.nvm
            ~/.local/bin
            ~/.local/share/spacetime/bin
            ~/.local/share/binaryen
            ~/.boc-env
          # ~/.local/share/spacetime/bin holds the binaries the ~/.local/bin/spacetime
          # launcher execs. Caching only the launcher restored a spacetime that could
          # not run, and install-toolchain.sh skipped reinstalling it.
          #
          # `/bin` is load-bearing. Caching the whole directory also carried
          # `data/` — the standalone database — into the next run, while the identity
          # that owns it (~/.config/spacetime) was never cached. The restored run
          # minted a fresh identity, and publishing to a database it did not own
          # failed with `403 Forbidden ... not authorized ... update database`,
          # surfacing four stages later as "webServer was not able to start".
          # A CI run should begin with no database anyway: caching one lets state
          # leak between commits and makes runs order-dependent.
          #
          # As of M9.6 deploy.sh puts the database in the repo's .devhome instead, so
          # `data/` no longer exists here at all. This narrowing stays as the second
          # layer: the path list is what a future edit is most likely to get wrong.
          #
          # ci.yml is in the key because this path list defines the cache's shape:
          # without it, editing these paths silently restores an old-shaped cache and
          # reintroduces exactly that bug.
          key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/install-toolchain.sh', 'scripts/dev.sh', '.github/workflows/ci.yml') }}

      - name: Install toolchain
        run: bash scripts/install-toolchain.sh

      - name: Cache build artifacts
        if: matrix.cache == 'warm'
        uses: actions/cache@v6
        with:
          path: |
            server/target
            client/node_modules
            ~/.cache/ms-playwright
          key: build-${{ runner.os }}-${{ hashFiles('server/Cargo.lock', 'client/package-lock.json') }}
          restore-keys: build-${{ runner.os }}-

      - name: Install client dependencies
        if: hashFiles('client/package-lock.json') != ''
        run: bash -c '. "$HOME/.boc-env"; cd client && npm ci'

      # The browser binary comes from npm; the shared libraries it links against do
      # not. --with-deps handles both on the apt-based runner (install-toolchain.sh
      # covers the Fedora dev container, which --with-deps does not support).
      - name: Install Playwright browser
        if: hashFiles('client/e2e/**') != ''
        run: bash -c '. "$HOME/.boc-env"; cd client && npx playwright install --with-deps chromium'

      - name: Verify
        run: ./scripts/verify.sh

  scope-guard:
    # The MVP's main failure mode is not bugs, it is scope creep. This makes an
    # unreviewed scope change visible on the run rather than discovered at release.
    #
    # Runs on push as well as pull_request, which is the whole point of it existing:
    # this repo works directly on main, so the previous `pull_request`-only condition
    # meant the job was skipped in every one of the first fourteen runs and never
    # examined a diff. Both commits that moved the scope boundary went past it.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the base commit of either event is present.
          fetch-depth: 0
      - name: Flag changes to the scope contract
        # A push compares against the commit that was there before; a pull request
        # against the merge base with its target. The script resolves an unusable
        # base — zero sha, or a commit lost to a force-push — to the parent commit.
        #
        # The context values arrive through `env` rather than `${{ }}` inside the
        # script body. A branch name is attacker-chosen on a fork's pull request and
        # may legally contain a double quote, which would end the string and leave the
        # rest of the name running as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ./scripts/scope-guard.sh \
              "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" \
              "$HEAD_SHA"
          else
            ./scripts/scope-guard.sh "$BEFORE_SHA" "$HEAD_SHA"
          fi
